services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: survey
      POSTGRES_PASSWORD: survey
      POSTGRES_DB: survey
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - survey_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U survey -d survey']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  survey_db:
    name: ${SURVEY_DB_VOLUME:-ai-survey-platform_survey_db}
